<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a3e">
<title>Souly — Parents' Hub</title>

<!--
  Nothing is loaded from the internet. Not a font, not a framework, not an
  icon set. At the competition this laptop is on a MiFi with no upstream
  connection, and every external <link> or <script> on this page would be a
  request that hangs and then fails.

  The shell below is empty on purpose, exactly like static/student/index.html:
  every screen is built in pages.js from what the server sent. A number
  hardcoded in markup is a number that can quietly disagree with the database.
-->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1a3e'/%3E%3Crect x='30' y='45' width='40' height='34' rx='13' fill='%237c3aed'/%3E%3Crect x='35' y='22' width='30' height='28' rx='11' fill='%23a78bfa'/%3E%3Ccircle cx='43' cy='34' r='4.5' fill='%23fff'/%3E%3Ccircle cx='57' cy='34' r='4.5' fill='%23fff'/%3E%3Crect x='44' y='42' width='12' height='4' rx='2' fill='%23fbbf24'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/parent/base.css">
</head>
<body>

<!-- Sign-in. Covers everything until there is a valid parent token. -->
<div id="gate" class="gate hidden"></div>

<div id="shell" class="shell hidden">
  <aside id="sidebar" class="sidebar"></aside>
  <div id="scrim" class="hidden"></div>
  <div class="main" id="main">
    <div id="header"></div>
    <div id="page" class="page"></div>
  </div>
</div>

<div id="boot" class="loading" style="padding-top:120px">
  <div class="spinner"></div>
  Opening the Parents' Hub…
</div>

<div id="toasts" class="toasts"></div>
<div id="modal"></div>

<script src="/static/parent/api.js"></script>
<script src="/static/parent/pages.js"></script>
<script src="/static/parent/app.js"></script>
</body>
</html>
