<!--
  =============================================================================
  Souly — the teacher's Classroom view
  Revision of righty-classroom.html, scoped to what the system can actually do.
  =============================================================================

  WHAT CHANGED, AND WHY
  ---------------------
  The original mock was designed for a different product: a robot with servos,
  a classroom streaming continuous engagement telemetry, and lessons running on
  a synchronised timer. None of that is in the built system. Rather than delete
  those ideas, every one of them is still in the sidebar — locked, with an
  honest explanation of what it needs before it can work. A judge who opens a
  locked page sees a roadmap. A judge who clicks a fake button sees a demo.

  THE BIG ADDITION: CLASSES
  -------------------------
  There was no notion of a class anywhere — not in the mock's data, and not in
  the database. One teacher now holds several classes, a student can sit in more
  than one, and the class switcher in the header decides what every screen is
  about. Schema needed (schema_v8.sql):

      classes         (id, name, grade, subject_id, academic_year, is_active)
      class_students  (class_id, student_id)
      teacher_classes (teacher_id, class_id, role)   -- role: lead | assistant

      v_teacher_classes  -- the join every teacher query passes through,
                            the same discipline as v_parent_children

  NOTHING IS LOADED FROM THE INTERNET. No Tailwind CDN, no Font Awesome, no
  Chart.js, no Google Font. At the competition the laptop is on a MiFi with no
  upstream, and every external <script> in the original would have failed and
  left a blank page. Icons are inline SVG; the design tokens are the frontend
  team's own, copied out of their tailwind.config.

  THE DATA BELOW IS MOCK, SHAPED LIKE THE REAL API. Every object matches the
  response the teacher endpoints will return, so porting this into
  static/teacher/ is mechanical: swap DEMO for fetch() and the render functions
  do not change.
  =============================================================================
-->

<style>
:root{
  --navy:#1a1a3e; --deep:#2d2b5a; --purple:#7c3aed; --bright:#8b5cf6;
  --light:#a78bfa; --lavender:#ede9fe; --soft:#f5f3ff; --accent:#c4b5fd;
  --page:#f8f7fc; --card:#fff; --line:#f0eef7;
  --ink:#1a1a3e; --muted:#6b7280; --faint:#9ca3af;
  --green:#10b981; --amber:#f59e0b; --blue:#3b82f6; --red:#ef4444;
  --radius:16px; --radius-sm:12px;
  --shadow:0 4px 20px rgba(26,26,62,.08);
  --shadow-lg:0 8px 30px rgba(26,26,62,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:var(--page); color:var(--ink); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
*{scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- layout ---------- */
.shell{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.scroll{flex:1;overflow-y:auto;padding:24px}
.scroll>*+*{margin-top:22px}
.page-enter{animation:pageEnter .3s ease}
@keyframes pageEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- sidebar ---------- */
.sidebar{
  width:256px;flex-shrink:0;display:flex;flex-direction:column;color:#fff;
  background:linear-gradient(180deg,var(--navy) 0%,var(--deep) 100%);
  overflow-y:auto;z-index:40;
}
.brand{padding:22px 22px 14px;display:flex;align-items:center;gap:12px}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--purple),var(--bright));
  display:flex;align-items:center;justify-content:center;
}
.brand h1{font-size:17px;font-weight:700;line-height:1.15}
.brand p{font-size:11px;color:var(--accent);opacity:.85}
.nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:3px}
.nav-item{
  width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:#d1d5db;
  text-align:left;transition:background .2s,color .2s;
}
.nav-item:hover{background:rgba(139,92,246,.15);color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--purple),var(--bright));color:#fff}
.nav-item .lbl{flex:1}
.nav-item.locked{color:#8b8ba7}
.nav-item.locked:hover{background:rgba(255,255,255,.06);color:#b9b9cd}
.nav-badge{background:var(--red);color:#fff;font-size:11px;font-weight:600;
  border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav-sep{
  padding:16px 16px 7px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:#7c7c99;font-weight:700;
}
.sidebar-foot{padding:14px;margin-top:auto}
.sidebar-card{background:rgba(255,255,255,.1);border-radius:var(--radius);padding:14px;text-align:center}
.sidebar-card p{font-size:12px;color:rgba(255,255,255,.8);margin-top:8px;line-height:1.5}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.header{

.header h2{font-size:19px;font-weight:700}

.vr{width:1px;height:32px;background:#e9e7f2}

.switcher{position:relative}

.switcher-menu{

table{width:100%;border-collapse:collapse}

th{text-align:left;padding:11px 16px;font-size:11px;font-weight:700;color:var(--muted);

td{padding:12px 16px;border-bottom:1px solid #f5f4fa;font-size:14px}

.table-wrap{overflow-x:auto}

/* ---------- flags ---------- */

}

.lc-step.now{background:var(--lavender);color:var(--purple);font-weight:700}
.lc-arrow{color:#d1d5db;font-size:11px}

.btn{padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;

.menu-btn{display:none}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g21{grid-template-columns:minmax(0,1fr)}}

  .menu-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;

  .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);
    transition:transform .28s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .sidebar.open{transform:translateX(0)}
  .nav-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  .scroll{padding:16px}.g2,.g4{grid-template-columns:minmax(0,1fr)}

}

<body>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div id="nav-scrim"></div>
  <div class="main">
    <div id="header"></div>
    <div class="scroll" id="page"></div>
  </div>
</div>

<div id="drawer"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ===========================================================================
   DEMO DATA — shaped exactly like the teacher API will return.
   Swap DEMO for fetch() and none of the render functions change.
   =========================================================================== */

/* ===========================================================================
   Live data
   ---------------------------------------------------------------------------
   This object used to be a hand-written mock. It is now filled from the Souly
   API on every load, on every class switch, and on a 20-second poll.

   Its SHAPE is deliberately unchanged, so every render function below —
   pageToday, pageStudents, pageMessages and the rest — works exactly as the
   front-end developer wrote it. Nothing in the design was touched.
   =========================================================================== */

const DEMO = {
  teacher: { id:null, full_name:'', title:'', initials:'' },
  classes: [], students: {}, flags: [], notes: [], threads: [], books: [], review: [],
};

/* --- the API client ------------------------------------------------------
   One header, X-Souly-Teacher. It is its own realm: a parent's code or a
   student's token cannot be presented here, and this one cannot be presented
   to theirs.                                                              */
const API = {
  token: sessionStorage.getItem('souly_teacher_token') || null,
  async call(method, path, body){
    const opt = { method, headers:{} };
    if (this.token) opt.headers['X-Souly-Teacher'] = this.token;
    if (body !== undefined){
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    const r = await fetch(path, opt);
    const txt = await r.text();
    let data = {}; try { data = txt ? JSON.parse(txt) : {}; } catch(_){}
    if (r.status === 401 && path.indexOf('/auth/login') < 0){
      signOut(true); throw new Error('Session expired');
    }
    if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
    return data;
  },
  get(p){ return this.call('GET', p); },
  post(p,b){ return this.call('POST', p, b === undefined ? {} : b); },
  patch(p,b){ return this.call('PATCH', p, b); },
  put(p,b){ return this.call('PUT', p, b); },
};

/* --- API shapes -> the shape the screens already expect ------------------ */
const FLAG_WORDS = {
  gaze_away:'Looked away from the screen', head_turn:'Turned away from the work',
  absent:'Not at the desk', prolonged_inactivity:'Stopped working',
  repeated_error:'Several wrong attempts in a row', help_requested:'Asked for help',
  attention_drift:'Attention drifted', stalled:'No input for a while',
  frustration:'Repeated wrong attempts',
};

function mapStudent(s){
  const ind = s.independence || {};
  return {
    ext:s.external_id, name:s.display_name, grade:s.grade,
    avatar:s.avatar || '🙂', color:s.avatar_color || '#7C3AED',
    support:s.support_profile || 'none',
    support_notes:s.support_notes || 'Standard profile — no accommodations recorded.',
    drift_ms:s.drift_threshold_ms, last_active:s.last_active_date,
    week_minutes:Math.round((s.week_seconds || 0)/60),
    pages:s.pages_worked, stars:s.stars, level:s.level, streak:s.day_streak,
    help_week:(ind.help_this_week != null ? ind.help_this_week : 0),
    help_prev:(ind.help_last_week != null ? ind.help_last_week : 0),
    unaided_pct:(ind.unaided_pct != null ? ind.unaided_pct : null),
    mastery:s.overall_pct, onboarded:s.onboarded,
    parent:s.parent_name || 'no parent linked',
    state:s.state, pending:s.pending_flags,
  };
}

function mapFlag(f, cid){
  const words = FLAG_WORDS[f.flag_type] || String(f.flag_type).replace(/_/g,' ');
  const secs  = f.duration_ms ? ' for ' + Math.round(f.duration_ms/1000) + 's' : '';
  const where = f.topic_title ? ' during ' + f.topic_title : '';
  return { id:f.id, class_id:cid, student:f.student_external_id, type:f.flag_type,
           confidence:f.confidence, status:f.status,
           seconds_ago:(f.seconds_ago != null ? f.seconds_ago : 0),
           detail: words + secs + where + '.' };
}

/* --- loading ------------------------------------------------------------- */
async function loadClasses(){
  const d = await API.get('/api/teacher/classes');
  DEMO.teacher = d.teacher || DEMO.teacher;
  DEMO.classes = (d.classes || []).map(c => ({
    id:c.id, name:c.name, grade:c.grade, subject:c.subject,
    icon:c.icon || '📘', color:c.color || '#7C3AED', role:c.role,
    students:[], pending:c.pending_flags, count:c.student_count,
  }));
  if (!DEMO.classes.some(c => c.id === S.classId))
    S.classId = (DEMO.classes[0] || {}).id;
}

async function loadClass(cid){
  if (!cid) return;
  const [ov, notes, convos, books, review] = await Promise.all([
    API.get('/api/teacher/classes/'+cid+'/overview'),
    API.get('/api/teacher/classes/'+cid+'/notes'),
    API.get('/api/teacher/conversations?class_id='+cid),
    API.get('/api/teacher/curriculum'),
    API.get('/api/teacher/review'),
  ]);

  const k = DEMO.classes.find(c => c.id === cid);
  if (k) k.students = ov.roster.map(s => s.external_id);
  ov.roster.forEach(s => { DEMO.students[s.external_id] = mapStudent(s); });

  DEMO.flags = DEMO.flags.filter(f => f.class_id !== cid)
                         .concat(ov.flags.map(f => mapFlag(f, cid)));

  DEMO.notes = DEMO.notes.filter(n => n.class_id !== cid).concat(
    (notes.notes || []).map(n => ({ id:n.id, class_id:cid,
      student:n.student_external_id, tone:n.tone, read:n.read,
      ago:ago(n.seconds_ago || 0), body:n.body })));

  // Keep any thread already opened, so switching screens does not blank it.
  const keep = {};
  DEMO.threads.forEach(t => { if (t.messages && t.messages.length) keep[t.id] = t.messages; });
  DEMO.threads = DEMO.threads.filter(t => t.class_id !== cid).concat(
    (convos.conversations || []).map(t => ({ id:t.id, class_id:cid,
      student:t.child_ext_id, parent:t.parent, unread:t.unread,
      last:t.last_body || '', messages: keep[t.id] || [] })));

  DEMO.books = (books.books || []).map(b => ({ code:b.code, title:b.title,
    subject:b.subject, grade:b.grade, pages:b.pages, lessons:b.lessons,
    verified:b.verified_lessons }));

  DEMO.review = (review.questions || []).map(q => ({ id:q.id, lesson:q.lesson,
    subject:q.subject, stem:q.stem, options:q.options, correct:q.correct,
    explanation:q.explanation }));

  const cur = classThreads();
  if (!cur.some(t => t.id === S.threadId)) S.threadId = (cur[0] || {}).id;
}

async function openThread(id){
  if (!id) return;
  const d = await API.get('/api/teacher/conversations/'+id);
  const t = DEMO.threads.find(x => x.id === id);
  if (t){
    t.messages = (d.messages || []).map(m => ({ from:m.from, body:m.body,
      time:String(m.created_at || '').slice(11,16) }));
    t.unread = 0;
  }
}

async function refresh(announce){
  try {
    await loadClasses();
    await loadClass(S.classId);
    if (S.threadId) await openThread(S.threadId);
    render();
    if (announce) toast('Updated from the database', 'info');
  } catch (e){
    if (String(e.message) !== 'Session expired') toast(e.message, 'error');
  }
}

  '<div id="signin" style="position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:#12101f;padding:20px">'

  + '<input id="si-email" type="email" placeholder="Email" autocomplete="username" required style="padding:11px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.22);font:inherit;background:transparent;color:inherit">'
  + '<input id="si-pass" type="password" placeholder="Password" autocomplete="current-password" required style="padding:11px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.22);font:inherit;background:transparent;color:inherit">'

function signOut(expired){
  API.token = null;
  sessionStorage.removeItem('souly_teacher_token');
  clearInterval(window.__soulyPoll);
  loginScreen(expired ? 'Session expired — sign in again.' : '');
}

/* A teacher is typing if the caret is in a box, or if a box that is meant to
   be sent still holds text. Either way the background poll waits a tick. It
   never queues up: the next tick is 20 s away and the data is not urgent. */
function isTyping(){
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' ||
            (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(a.type)))) return true;
  return ['reply','note-body'].some(function(id){
    const el = document.getElementById(id);
    return el && el.value.trim() !== '';
  });
}

async function boot(){
  await refresh(false);
  clearInterval(window.__soulyPoll);
  // Reads the database on open, on every class switch, and on this timer.
  // A teacher leaves this screen open for a whole lesson.
  window.__soulyPoll = setInterval(function(){
    if (document.hidden || !API.token) return;
    if (isTyping()) return;          // never interrupt a half-written message
    refresh(false);
  }, 20000);
}

const SUPPORT = { adhd:'ADHD', autism:'Autistic', dyslexia:'Dyslexia',
  visual_impairment:'Visual impairment', hearing_impairment:'Hearing impairment', none:'—' };
const supportLabel = k => SUPPORT[k] || k;

/* --------------------------------------------------------------------------
   Attention flags — the page the whole system points at.
   The lifecycle strip is not decoration: it is the actual state machine in
   app/routers/flags.py, and illegal jumps return 409 there.
   -------------------------------------------------------------------------- */
const FLAG_COPY = {
  attention_drift: ['👀','Looked away',   'The camera saw sustained gaze away from the screen.'],
  stalled:         ['⏸️','Stopped working','No input for longer than usual on one question.'],
  frustration:     ['😣','Struggling',     'Several wrong attempts in a row, then a pause.'],
};

function flagCard(f, compact){
  const s = DEMO.students[f.student];
  const [emoji, title, blurb] = FLAG_COPY[f.type] || ['❓', f.type, ''];
  const steps = ['pending','approved','in_progress','done'];
  const at = steps.indexOf(f.status);

  return `<article class="flag ${f.status}">
    <div class="flag-head">
      <div class="row-icon" style="background:${s.color}1a">${emoji}</div>
      <div class="grow">
        <p class="row-title">${esc(s.name)} — ${esc(title)}</p>
        <p class="row-sub">${ago(f.seconds_ago)} · confidence ${(f.confidence*100).toFixed(0)}%
          ${s.support!=='none'?` · ${esc(supportLabel(s.support))}`:''}</p>
      </div>
      <span class="pill ${f.status==='pending'?'pill-amber':f.status==='done'?'pill-green':'pill-blue'}">
        ${f.status.replace('_',' ')}</span>
    </div>
    <p class="small muted" style="line-height:1.6">${esc(f.detail)}</p>

    ${!compact ? `<div class="lifecycle">
      ${steps.map((st,i) => `
        <span class="lc-step ${i<at?'done':i===at?'now':''}">${st.replace('_',' ')}</span>
        ${i<3?'<span class="lc-arrow">→</span>':''}`).join('')}
    </div>` : ''}

    ${f.status==='pending' ? `
      <div class="flag-actions">
        <button class="btn btn-primary btn-sm" data-flag-approve="${f.id}">
          ${ico('check',14)} Send Souly over</button>
        <button class="btn btn-ghost btn-sm" data-flag-dismiss="${f.id}">Not now</button>
        <button class="btn btn-secondary btn-sm" data-student="${f.student}">Open ${esc(s.name)}</button>
      </div>` : ''}

    ${f.status==='pending' && s.support!=='none' ? `
      <p class="hint" style="margin-top:10px">
        ${esc(s.name)}'s drift threshold is set to ${(s.drift_ms/1000).toFixed(1)}s —
        raise it in Class Settings if this is self-regulation rather than distraction.
      </p>` : ''}
  </article>`;
}

function pageFlags(){
  const pending = classFlags('pending');
  const active  = classFlags().filter(f => f.status==='approved' || f.status==='in_progress');
  const done    = classFlags('done');

  return `
  <div class="grid g3">
    ${stat('🔔','tint-amber', pending.length, 'Waiting for you')}
    ${stat('🏃','tint-blue',  active.length,  'Souly is handling')}

  <div class="card">

    </div>

      : `<div class="empty"><span class="emoji">✅</span><h4>Queue is clear</h4>

}

      Only a teacher can do this — otherwise the first child at the tablet could lock a
      classmate out of their own profile.
    </p>
  </div>`;
}

/* -------------------------------------------------------------------------- */
function pageLocked(nav){
  return `
  <div class="locked-wrap page-enter">
    <div class="locked-hero">
      <span class="lock-badge">${ico('lock',13)} Coming soon</span>
      <h2>${esc(nav.label)}</h2>
      <p>${esc(nav.locked.what)}</p>
    </div>
    <div class="locked-detail">
      <p class="small muted" style="margin:20px 4px 12px;font-weight:600">
        What has to exist first
      </p>
      ${nav.locked.needs.map(([t,d]) => `
        <div class="need">
          <span class="dot"></span>
          <span><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span></span>
        </div>`).join('')}
    </div>
    <p class="hint center" style="margin-top:22px">
      This screen is deliberately empty rather than filled with numbers we cannot source.
    </p>
  </div>`;
}

/* ===========================================================================
   Student drawer
   =========================================================================== */
function drawDrawer(){
  const host = document.getElementById('drawer');
  if (!S.drawerStudent) { host.innerHTML = ''; return; }
  const s = DEMO.students[S.drawerStudent];
  const inClasses = DEMO.classes.filter(c => c.students.includes(s.ext));

  host.innerHTML = `
    <div class="scrim" data-act="close-drawer"></div>
    <aside class="drawer">
      <div class="drawer-head">
        <span class="row-icon" style="background:${s.color}1a;width:46px;height:46px;font-size:22px">${s.avatar}</span>
        <div class="grow">
          <h3 style="font-size:18px;font-weight:700">${esc(s.name)}</h3>
          <p class="small muted">Grade ${esc(s.grade)} · parent: ${esc(s.parent)}</p>
        </div>
        <button class="btn btn-ghost btn-sm" data-act="close-drawer">${ico('x',16)}</button>
      </div>
      <div class="drawer-body">
        ${s.support!=='none' ? `
          <div class="card" style="box-shadow:none;background:var(--soft);padding:16px">
            <p class="small bold" style="margin-bottom:5px">${esc(supportLabel(s.support))}</p>
            <p class="small muted" style="line-height:1.6">${esc(s.support_notes)}</p>
          </div>` : ''}

        <div class="grid g2" style="gap:12px">
          ${stat('⏱️','tint-blue',  s.week_minutes+' min','This week')}
          ${stat('📄','tint-purple',s.pages,'Lesson pages')}
          ${stat('🔥','tint-amber', s.streak,'Day streak')}
          ${stat('⭐','tint-green', s.stars,'Stars · level '+s.level)}
        </div>

        <div>
          <p class="small bold" style="margin-bottom:9px">Working independently</p>
          ${s.help_week ? `
            <div class="kv"><span class="k">Asked Souly for help this week</span>
              <span class="v">${s.help_week}</span></div>
            <div class="kv"><span class="k">Last week</span>
              <span class="v">${s.help_prev} <span class="small faint">— no comparison yet</span></span></div>
            ${s.unaided_pct!=null?`
              <div class="kv"><span class="k">Pages finished with no help</span>
                <span class="v">${s.unaided_pct}%</span></div>`:''}
          ` : `<p class="small muted">Nothing measured yet.</p>`}
        </div>

        <div>
          <p class="small bold" style="margin-bottom:9px">Classes with you</p>
          ${inClasses.map(c => `
            <div class="kv">
              <span class="k">${c.icon} ${esc(c.name)}</span>
              <span class="v small">${c.id===S.classId?'current':''}</span>
            </div>`).join('')}
        </div>

        <div>
          <p class="small bold" style="margin-bottom:9px">Camera sensitivity</p>
          <div class="kv">
            <span class="k">Drift threshold</span>
            <span class="v">${(s.drift_ms/1000).toFixed(1)}s</span>
          </div>
        </div>
      </div>
      <div class="drawer-foot">
        <button class="btn btn-secondary grow" data-act="note-for">Write a note home</button>
        <button class="btn btn-primary grow" data-act="close-drawer">Done</button>
      </div>
    </aside>`;
}

/* ===========================================================================
   Render + events
   =========================================================================== */
/* --- keeping what the teacher typed -------------------------------------
   render() rebuilds whole subtrees with innerHTML, which destroys every input
   inside them. A refresh landing mid-sentence used to wipe the box. These two
   run either side of the rebuild so the text, the caret and the focus survive
   any re-render, whoever triggered it. */
function captureInputs(){
  // S.page is already the NEW page by the time render() runs - go() sets it
  // first. So compare against the page that was last actually painted.
  const st = { values:{}, focus:null, start:0, end:0, scroll:0, page:S._painted };
  document.querySelectorAll('input[id], textarea[id], select[id]').forEach(function(el){
    if (el.type === 'password' || el.type === 'file') return;
    st.values[el.id] = el.value;
  });
  const a = document.activeElement;
  if (a && a.id && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){
    st.focus = a.id;
    try { st.start = a.selectionStart; st.end = a.selectionEnd; } catch(e){}
  }
  const host = document.getElementById('page');
  if (host) st.scroll = host.scrollTop;
  return st;
}

function restoreInputs(st){
  Object.keys(st.values).forEach(function(id){
    const el = document.getElementById(id);
    if (!el || el.value === st.values[id]) return;
    if (el.tagName === 'SELECT'){
      // Only restore a choice that still exists after the reload.
      for (let i = 0; i < el.options.length; i++)
        if (el.options[i].value === st.values[id]) { el.value = st.values[id]; break; }
    } else {
      el.value = st.values[id];
    }
  });
  if (st.focus){
    const el = document.getElementById(st.focus);
    if (el){
      el.focus();
      try { el.setSelectionRange(st.start, st.end); } catch(e){}
    }
  }
}

function render(){
  const keep = captureInputs();
  drawSidebar();
  drawHeader();
  const nav = NAV.find(n => n.id === S.page);
  const host = document.getElementById('page');

  let html;
  if (nav && nav.locked)            html = pageLocked(nav);
  else if (S.page === 'today')      html = pageToday();
  else if (S.page === 'flags')      html = pageFlags();
  else if (S.page === 'students')   html = pageStudents();
  else if (S.page === 'messages')   html = pageMessages();
  else if (S.page === 'curriculum') html = pageCurriculum();
  else if (S.page === 'review')     html = pageReview();
  else if (S.page === 'settings')   html = pageSettings();
  else                              html = pageToday();

  host.innerHTML = html;

  // Animate and jump to the top only when the teacher actually moved to a
  // different screen. A background refresh of the screen they are already on
  // must not flash or scroll under them - that is what looked like the page
  // reloading itself.
  const moved = keep.page !== S.page;
  S._painted = S.page;
  if (moved){
    host.classList.remove('page-enter'); void host.offsetWidth; host.classList.add('page-enter');
    host.scrollTop = 0;
  } else {
    host.scrollTop = keep.scroll;
  }
  drawDrawer();
  if (!moved) restoreInputs(keep);
}

function go(page){ S.page = page; S.switcherOpen = false; S.menuOpen = false; render(); }

document.addEventListener('click', e => {
  const q = sel => e.target.closest(sel);

  const nav = q('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }

  if (q('[data-act="switcher"]')) { S.switcherOpen = !S.switcherOpen; drawHeader(); return; }
  if (S.switcherOpen && !q('.switcher')) { S.switcherOpen = false; drawHeader(); }

  const pick = q('[data-class]');
  if (pick) {
    S.classId = Number(pick.dataset.class);
    S.switcherOpen = false;
    S.threadId = (classThreads()[0] || {}).id;
    // A class switch is a fresh read, not a filter over stale memory.
    loadClass(S.classId).then(render).catch(e => toast(e.message,'error'));
    // Stay on the same screen. A teacher comparing two classes should not be
    // thrown back to Today on every switch.
    render();
    toast('Now showing ' + cls().name, 'info');
    return;
  }

  const st = q('[data-student]');
  if (st) { S.drawerStudent = st.dataset.student; drawDrawer(); return; }

  const th = q('[data-thread]');
  if (th) {
    S.threadId = Number(th.dataset.thread);
    openThread(S.threadId).then(render).catch(e => toast(e.message,'error'));
    render(); return;
  }

  const tone = q('[data-tone]');
  if (tone) { S.noteTone = tone.dataset.tone; render(); return; }

  const ap = q('[data-flag-approve]');
  if (ap) {
    const id = Number(ap.dataset.flagApprove);
    const f = DEMO.flags.find(x => x.id === id) || {};
    const who = (DEMO.students[f.student] || {}).name || 'the student';
    API.patch('/api/teacher/flags/' + id, { status:'approved', actor:'teacher' })
       .then(() => { toast('Souly is on its way to ' + who, 'success');
                     return loadClass(S.classId).then(render); })
       .catch(e => toast(e.message, 'error'));
    return;
  }
  const dm = q('[data-flag-dismiss]');
  if (dm) {
    const id = Number(dm.dataset.flagDismiss);
    API.patch('/api/teacher/flags/' + id, { status:'dismissed', actor:'teacher' })
       .then(() => { toast('Flag dismissed — logged, not acted on', 'info');
                     return loadClass(S.classId).then(render); })
       .catch(e => toast(e.message, 'error'));
    return;
  }

  const okq = q('[data-approve]');
  if (okq) {
    API.post('/api/teacher/review/' + Number(okq.dataset.approve), { decision:'approve' })
       .then(() => { toast('Approved — Souly can use this question now', 'success');
                     return loadClass(S.classId).then(render); })
       .catch(e => toast(e.message, 'error'));
    return;
  }
  const noq = q('[data-reject]');
  if (noq) {
    API.post('/api/teacher/review/' + Number(noq.dataset.reject), { decision:'reject' })
       .then(() => { toast('Rejected — it will not be shown to any child', 'info');
                     return loadClass(S.classId).then(render); })
       .catch(e => toast(e.message, 'error'));
    return;
  }

  const drift = q('[data-drift]');
  if (drift) {
    const [ext, delta] = drift.dataset.drift.split(':');
    const st = DEMO.students[ext];
    const next = Math.max(2000, Math.min(20000, st.drift_ms + Number(delta)));
    st.drift_ms = next; render();
    API.patch('/api/teacher/students/' + ext, { drift_threshold_ms: next })
       .catch(e => { toast(e.message, 'error'); loadClass(S.classId).then(render); });
    return;
  }

  const reset = q('[data-reset]');
  if (reset) {
    const ext = reset.dataset.reset;
    API.post('/api/teacher/students/' + ext + '/reset-password')
       .then(d => toast(d.student + ' can choose new pictures at next sign-in', 'success'))
       .catch(e => toast(e.message, 'error'));
    return;
  }

  const act = q('[data-act]');
  if (act) switch (act.dataset.act) {
    case 'menu': S.menuOpen = !S.menuOpen; drawSidebar(); return;
    case 'close-drawer': S.drawerStudent = null; drawDrawer(); return;
    case 'note-for': {
      const name = DEMO.students[S.drawerStudent].name;
      S.drawerStudent = null; go('messages');
      toast('Writing a note about ' + name, 'info'); return;
    }
    case 'send-note': {
      const body = (document.getElementById('note-body')||{}).value || '';
      if (!body.trim()) { toast('Write something first', 'error'); return; }
      const ext = document.getElementById('note-student').value;
      API.post('/api/teacher/notes', { student_external_id: ext,
                                       tone: S.noteTone, body: body.trim() })
         .then(() => { toast('Sent — it is in ' + (DEMO.students[ext]||{}).parent +
                             "'s hub now", 'success');
                       // Clear it before the re-render, or restoreInputs puts
                       // the sent note straight back into the box.
                       const nb = document.getElementById('note-body');
                       if (nb) nb.value = '';
                       return loadClass(S.classId).then(render); })
         .catch(e => toast(e.message, 'error'));
      return;
    }
    case 'reply': {
      const input = document.getElementById('reply');
      const body = (input.value||'').trim();
      if (!body) return;
      input.value = '';
      API.post('/api/teacher/conversations/' + S.threadId + '/messages', { body })
         .then(() => openThread(S.threadId))
         .then(() => { render(); toast('Reply sent — it is in the parent\u2019s hub', 'success'); })
         .catch(e => toast(e.message, 'error'));
      return;
    }
    case 'signout':
      API.post('/api/teacher/auth/logout').catch(function(){}).then(function(){ signOut(false); });
      return;
  }

  if (e.target.id === 'nav-scrim') { S.menuOpen = false; drawSidebar(); }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.drawerStudent) { S.drawerStudent = null; drawDrawer(); return; }
  if (S.switcherOpen)   { S.switcherOpen = false; drawHeader(); }
  if (S.menuOpen)       { S.menuOpen = false; drawSidebar(); }
});

document.addEventListener('keypress', e => {
  if (e.key === 'Enter' && e.target.id === 'reply') {
    document.querySelector('[data-act="reply"]').click();
  }
});

/* Nothing renders until real data has arrived. */
if (API.token) boot(); else loginScreen('');
</script>
